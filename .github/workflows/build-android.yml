name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview or production)'
        required: false
        default: 'preview'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗 Generate Native Android Code (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: ⬇️ Downgrade Gradle to 8.6 (Fix for Expo 51)
        working-directory: ./android
        run: sed -i 's/gradle-[0-9\.]*-all.zip/gradle-8.6-all.zip/g' gradle/wrapper/gradle-wrapper.properties

      - name: 🔨 Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-monitor-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📋 Build complete
        run: echo "✅ Build complete! Download the APK from the Actions tab Artifacts section."
